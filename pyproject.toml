[project]
name = "atconnect"
version = "0.1.0"
description = "Linux companion app for Audio-Technica Bluetooth headphones (ATH-M50xBT2)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# PyGObject (Gio, Gtk 4, libadwaita) comes from the system packages.
dependencies = []

[project.scripts]
atconnect = "atconnect.cli:main"

[project.gui-scripts]
atconnect-gtk = "atconnect.gui:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
